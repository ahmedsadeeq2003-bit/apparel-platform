<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Classic manga "impact burst" -- radiating tapered spikes from an
       off-center origin, generated programmatically-by-hand at 24 evenly
       spaced angles so every spike is genuinely symmetric. -->
