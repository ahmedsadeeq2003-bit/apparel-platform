<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Original dramatic halftone poster mark -- a radiating halftone dot
       burst behind jagged crackle shards, anchoring a short original
       wordmark. Single ink color, matching every other graphic-art piece
       in this collection. -->

  <!-- Halftone burst: dot radius grows with distance from center -->
  <g fill="#0a0a0a">
    <circle cx="200" cy="200" r="4"/>
    <circle cx="228" cy="196" r="5"/><circle cx="172" cy="196" r="5"/>
    <circle cx="200" cy="230" r="5"/><circle cx="200" cy="170" r="5"/>
    <circle cx="254" cy="180" r="6.5"/><circle cx="146" cy="180" r="6.5"/>
    <circle cx="254" cy="222" r="6.5"/><circle cx="146" cy="222" r="6.5"/>
    <circle cx="200" cy="260" r="6.5"/><circle cx="200" cy="140" r="6.5"/>
    <circle cx="284" cy="150" r="8"/><circle cx="116" cy="150" r="8"/>
    <circle cx="284" cy="252" r="8"/><circle cx="116" cy="252" r="8"/>
    <circle cx="200" cy="296" r="8"/><circle cx="200" cy="104" r="8"/>
    <circle cx="316" cy="200" r="9.5" opacity="0.85"/><circle cx="84" cy="200" r="9.5" opacity="0.85"/>
  </g>

  <!-- Jagged crackle shards radiating outward -->
  <g fill="#0a0a0a">
    <path d="M 200,200 L 220,60 L 236,96 L 208,140 Z"/>
    <path d="M 200,200 L 340,140 L 308,168 L 260,182 Z"/>
    <path d="M 200,200 L 336,300 L 296,286 L 252,232 Z"/>
    <path d="M 200,200 L 176,344 L 160,306 L 190,258 Z"/>
    <path d="M 200,200 L 56,254 L 90,224 L 138,214 Z"/>
    <path d="M 200,200 L 68,90 L 104,108 L 148,158 Z"/>
  </g>

  <text x="200" y="212" font-family="Anton, sans-serif" font-size="60" fill="#F5F1E8" text-anchor="middle">FURY</text>
</svg>
