    d="M 30,210 C 90,140 160,110 200,110 C 240,110 310,140 370,210 C 310,268 240,296 200,296 C 160,296 90,268 30,210 Z"
    fill="#0a0a0a"
  />
  <circle cx="200" cy="210" r="62" fill="#F5F1E8"/>
  <circle cx="200" cy="210" r="42" fill="#0a0a0a"/>
  <circle cx="184" cy="192" r="14" fill="#F5F1E8"/>
