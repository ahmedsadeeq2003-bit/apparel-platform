<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <!-- Original bold poster-title composition -- big stacked wordmark, a
       vertical tick-column rule standing in for a poster's decorative
       margin column, a corner stamp/seal, and top/bottom frame rules.
       "RONIN" / "SPIRIT UNBROKEN" is STITCH's own original phrase, not a
       character name or franchise title. -->

  <!-- Frame rules -->
  <path d="M 180,150 L 1050,150" stroke="#0a0a0a" stroke-width="6"/>
  <path d="M 180,168 L 1050,168" stroke="#0a0a0a" stroke-width="2" opacity="0.5"/>
  <path d="M 180,980 L 1050,980" stroke="#0a0a0a" stroke-width="6"/>
  <path d="M 180,962 L 1050,962" stroke="#0a0a0a" stroke-width="2" opacity="0.5"/>

  <!-- Decorative vertical tick column -->
  <g stroke="#0a0a0a" stroke-linecap="round">
    <path d="M 120,220 L 120,260" stroke-width="8"/>
    <path d="M 120,290 L 120,320" stroke-width="8"/>
    <path d="M 120,350 L 120,410" stroke-width="8"/>
    <path d="M 120,440 L 120,470" stroke-width="8"/>
    <path d="M 120,500 L 120,560" stroke-width="8"/>
    <path d="M 120,590 L 120,620" stroke-width="8"/>
    <path d="M 120,650 L 120,710" stroke-width="8"/>
    <path d="M 120,740 L 120,770" stroke-width="8"/>
    <path d="M 120,800 L 120,860" stroke-width="8"/>
    <path d="M 120,890 L 120,920" stroke-width="8"/>
  </g>

  <!-- Corner seal -->
  <g transform="translate(1000,230)">
    <circle r="58" fill="none" stroke="#0a0a0a" stroke-width="6"/>
    <circle r="42" fill="none" stroke="#0a0a0a" stroke-width="2.5"/>
    <path d="M 0,-20 L 17,10 L -17,10 Z" fill="#0a0a0a"/>
  </g>

  <!-- Main wordmark -->
  <text x="650" y="620" font-family="Anton, sans-serif" font-size="230" fill="#0a0a0a" text-anchor="middle">RONIN</text>
  <!-- Tagline -->
  <text x="650" y="710" font-family="Archivo, sans-serif" font-weight="700" font-size="52" letter-spacing="16" fill="#0a0a0a" text-anchor="middle">SPIRIT UNBROKEN</text>
</svg>
