<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <style>
      .word { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; fill: #0a0a0a; }
    </style>
    <clipPath id="bandsNO">
      <rect x="0" y="330" width="1200" height="16"/>
      <rect x="0" y="362" width="1200" height="9"/>
      <rect x="0" y="388" width="1200" height="24"/>
      <rect x="0" y="428" width="1200" height="13"/>
      <rect x="0" y="458" width="1200" height="18"/>
    </clipPath>
    <clipPath id="bandsSIGNAL">
      <rect x="0" y="690" width="1200" height="13"/>
      <rect x="0" y="718" width="1200" height="20"/>
      <rect x="0" y="754" width="1200" height="9"/>
      <rect x="0" y="778" width="1200" height="27"/>
      <rect x="0" y="820" width="1200" height="15"/>
      <rect x="0" y="850" width="1200" height="22"/>
    </clipPath>
  </defs>

  <!-- base NO -->
  <g class="word">
    <text x="600" y="470" text-anchor="middle" font-size="260" letter-spacing="4">NO</text>
  </g>
  <!-- glitch-displaced slices of NO -->
  <g class="word" clip-path="url(#bandsNO)" transform="translate(-16,0)">
    <text x="600" y="470" text-anchor="middle" font-size="260" letter-spacing="4">NO</text>
  </g>
  <g class="word" clip-path="url(#bandsNO)" transform="translate(13,0)" opacity="0.85">
    <text x="600" y="470" text-anchor="middle" font-size="260" letter-spacing="4">NO</text>
  </g>

  <!-- thin scan-line breaks -->
  <rect x="90" y="545" width="1020" height="4" fill="#0a0a0a" opacity="0.7"/>
  <rect x="240" y="566" width="520" height="3" fill="#0a0a0a" opacity="0.5"/>

  <!-- base SIGNAL, condensed -->
  <g class="word">
    <text x="600" y="820" text-anchor="middle" font-size="150" letter-spacing="0">SIGNAL</text>
  </g>
  <!-- glitch-displaced slices of SIGNAL -->
  <g class="word" clip-path="url(#bandsSIGNAL)" transform="translate(-18,0)">
    <text x="600" y="820" text-anchor="middle" font-size="150" letter-spacing="0">SIGNAL</text>
  </g>
  <g class="word" clip-path="url(#bandsSIGNAL)" transform="translate(15,0)" opacity="0.8">
    <text x="600" y="820" text-anchor="middle" font-size="150" letter-spacing="0">SIGNAL</text>
  </g>

  <!-- subtle distortion marks: broken diagonal ticks -->
  <path d="M 110,230 L 145,248" stroke="#0a0a0a" stroke-width="5"/>
  <path d="M 1060,940 L 1095,958" stroke="#0a0a0a" stroke-width="5"/>
  <path d="M 90,960 L 135,960" stroke="#0a0a0a" stroke-width="5"/>

  <!-- small static-noise dashes near edges -->
  <rect x="60" y="400" width="26" height="4" fill="#0a0a0a"/>
  <rect x="1112" y="600" width="20" height="4" fill="#0a0a0a"/>
</svg>
