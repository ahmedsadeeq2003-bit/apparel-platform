<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <style>
      .serif { font-family: 'Playfair Display', 'EB Garamond', Georgia, serif; font-weight: 500; fill: #0a0a0a; }
      .serif-italic { font-family: 'Playfair Display', 'EB Garamond', Georgia, serif; font-weight: 500; font-style: italic; fill: #0a0a0a; }
      .sans { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 500; fill: #0a0a0a; }
    </style>
  </defs>

  <!-- MADE -->
  <text class="serif" x="150" y="380" font-size="200" letter-spacing="1">Made</text>

  <!-- BY, tracked small sans caps flanked by a hand-stitched running line (craftsmanship motif) -->
  <g transform="translate(600,520)">
    <path d="M -330,0 l 22,0 M -284,0 l 22,0 M -238,0 l 22,0 M -192,0 l 22,0 M -146,0 l 22,0 M -100,0 l 12,0"
          stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
    <text class="sans" x="0" y="10" font-size="70" letter-spacing="16" text-anchor="middle">BY</text>
    <path d="M 88,0 l 12,0 M 122,0 l 22,0 M 168,0 l 22,0 M 214,0 l 22,0 M 260,0 l 22,0 M 306,0 l 22,0"
          stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- YOU, large serif italic, anchoring -->
  <text class="serif-italic" x="150" y="800" font-size="230" letter-spacing="1">You</text>

  <!-- minimal garment-label mark: small tag with a single stitched corner, signalling craftsmanship -->
  <g transform="translate(985,690)">
    <path d="M -55,-40 L 25,-40 L 55,-10 L 55,40 C 55,49 49,55 40,55 L -40,55 C -49,55 -55,49 -55,40 Z"
          fill="none" stroke="#0a0a0a" stroke-width="4"/>
    <circle cx="8" cy="-8" r="5" fill="none" stroke="#0a0a0a" stroke-width="3"/>
    <!-- hand-stitch dashes along the tag's diagonal seam -->
    <path d="M -3,-33 l 8,8 M 10,-20 l 8,8" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- thin baseline rule, editorial close -->
  <line x1="150" y1="860" x2="1050" y2="860" stroke="#0a0a0a" stroke-width="2"/>
</svg>
