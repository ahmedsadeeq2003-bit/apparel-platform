<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <!-- Original cyberpunk wordmark -- "GRID RUNNER" is STITCH's own phrase,
       not a game/franchise title. Glow is faked honestly (a wider stroke-
       only copy of the same glyphs sitting behind the solid fill), the
       same two-pass technique real screen-print glow effects use, not a
       CSS filter that wouldn't survive Fabric's SVG import. -->

  <!-- Circuit-trace accents flanking the wordmark -->
  <g stroke="#0a0a0a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 70,460 L 70,560 L 150,560 L 150,620"/>
    <path d="M 70,700 L 70,760 L 200,760"/>
    <path d="M 1130,460 L 1130,540 L 1040,540 L 1040,600"/>
    <path d="M 1130,700 L 1130,780 L 980,780"/>
  </g>
  <g fill="#0a0a0a">
    <rect x="64" y="614" width="12" height="12"/>
    <rect x="194" y="754" width="12" height="12"/>
    <rect x="1034" y="594" width="12" height="12"/>
    <rect x="974" y="774" width="12" height="12"/>
  </g>

  <!-- Glow pass (stroke only, wider) -->
  <text x="600" y="540" font-family="Anton, sans-serif" font-size="200" fill="none" stroke="#0a0a0a" stroke-width="16" text-anchor="middle" opacity="0.35">GRID</text>
  <text x="600" y="700" font-family="Archivo, sans-serif" font-weight="700" font-size="120" letter-spacing="22" fill="none" stroke="#0a0a0a" stroke-width="12" text-anchor="middle" opacity="0.3">RUNNER</text>

  <!-- Solid pass -->
  <text x="600" y="540" font-family="Anton, sans-serif" font-size="200" fill="#0a0a0a" text-anchor="middle">GRID</text>
  <text x="600" y="700" font-family="Archivo, sans-serif" font-weight="700" font-size="120" letter-spacing="22" fill="#0a0a0a" text-anchor="middle">RUNNER</text>
</svg>
